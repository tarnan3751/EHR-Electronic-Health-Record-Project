# Builds, checks and tests everything on every push and on pull requests into main.
# `ci` is the one check branch protection requires: add new jobs to its `needs` list.
# See "Continuous integration" in README.md.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  # A run started by hand can keep the desktop installers it builds (the desktop job). Every other run builds them and
  # keeps nothing: the repository is public, and the owner decides whether a downloadable artifact counts as publishing.
  workflow_dispatch:
    inputs:
      upload_installers:
        description: Keep the desktop installers as this run's artifacts, for 3 days
        type: boolean
        default: false
      desktop_version:
        description: Build the desktop installers as this version (such as 0.2.1, to test an update), not Cargo.toml's
        type: string
        default: ""

# Every job gets a read-only token unless it asks for more.
permissions:
  contents: read

# A newer push to the same branch cancels the older run. Runs on main always finish,
# so every commit on main gets its image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web:
    name: Web app
    runs-on: ubuntu-latest
    # The test step alone takes 17 to 25 minutes on a runner, with the tests of the expansion plan's phase 4 (step 9
    # reached the first limit of 15; step 13e's last run took 27 minutes 41 seconds of the 30, and step 13c2's was
    # cancelled at them).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the newest .NET 10 SDK, which global.json accepts.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # NuGet checks every package against known advisories; high and critical ones fail the run.
      - name: Restore
        run: dotnet restore Ehr.slnx "-warnaserror:NU1903;NU1904"

      - name: Build
        run: dotnet build Ehr.slnx --configuration Release --no-restore

      - name: Install Chromium for clinical workflow tests
        run: pwsh tests/Ehr.Web.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Check formatting
        run: dotnet format Ehr.slnx --verify-no-changes --no-restore

      # The tokens' CSS and the desktop app's copy of the shared CSS, fonts and logos match their sources.
      - name: Check the brand files
        run: dotnet run tools/brand/sync.cs -- --check

      # The Tailscale access rules parse, name only what they define, and have a test for every opening
      # (infra/tailscale/check.cs). Syntax only: they have never been applied to a tailnet.
      - name: Check the Tailscale policy file
        run: dotnet run infra/tailscale/check.cs

      - name: Test
        run: dotnet test --solution Ehr.slnx --configuration Release --no-build

  stack:
    name: Server stack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: infra/compose
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For the dotnet run scripts: the restore drill (restore-drill.cs) and the deployment's site check.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The one-time setup from infra/compose/README.md, with a self-signed certificate standing in for mkcert: one
      # certificate for the three sites and both databases, and, being self-signed, its own root for the database
      # clients to verify it against. The key must be readable by the app's non-root user.
      - name: Create settings and a certificate
        run: |
          cp .env.example .env
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=example.com" \
            -addext "subjectAltName=DNS:example.com,DNS:*.example.com,DNS:onprem-db,DNS:cloud-db,DNS:wan,DNS:localhost,IP:127.0.0.1" \
            -keyout certs/example.com-key.pem -out certs/example.com.pem
          chmod 644 certs/example.com-key.pem
          cp certs/example.com.pem certs/rootCA.pem

      - name: Check the Compose files
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.nvidia.yaml config --quiet
          docker compose -f compose.yaml -f compose.backup-drill.yaml config --quiet
          docker compose -f compose.yaml -f compose.desktop-updates.yaml config --quiet

      # The monitoring profile's configuration, with the tools of the versions compose.yaml pins: Prometheus's, every
      # alert held to its threshold and wait by its tests (infra/monitoring/alerts*.test.yml), Alertmanager's (the
      # stack's, and the example for a real server's relay), and the probes'.
      - name: Check the monitoring configuration
        run: |
          image() { docker compose --profile monitoring config --images "$1"; }
          docker run --rm -v "$PWD/../monitoring:/m:ro" -w /m --entrypoint promtool "$(image prometheus)" check config prometheus.yml
          docker run --rm -v "$PWD/../monitoring:/m:ro" -w /m --entrypoint promtool "$(image prometheus)" test rules alerts.test.yml alerts-backups.test.yml
          docker run --rm -v "$PWD/..:/i:ro" --entrypoint amtool "$(image alertmanager)" check-config /i/monitoring/alertmanager.yml /i/deploy/alertmanager.example.yml
          docker run --rm -v "$PWD/../monitoring:/m:ro" "$(image blackbox)" --config.file=/m/blackbox.yml --config.check

      - name: Build the images
        run: docker compose build

      # With the monitoring profile, which an alert is checked through below.
      - name: Start the stack
        run: docker compose --profile monitoring up --detach --wait --wait-timeout 300

      # On-site through the LAN, then off-site and the portal through the simulated internet. Nothing is served
      # without signing in: the clinic's home sends an anonymous browser to its sign-in page, the sign-in pages load,
      # and the desktop app's sync API refuses a request without a session token.
      - name: Pages load
        run: |
          check() {
            code=$(curl --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
              --cacert certs/example.com.pem --resolve "$1:127.0.0.1" \
              --output /dev/null --write-out "%{http_code}" "https://$1$2")
            echo "https://$1$2 $code (expected $3)"
            [ "$code" = "$3" ]
          }
          check ehr.example.com:8443 / 302
          check ehr.example.com:8443 /sign-in 200
          check ehr-remote.example.com:9443 /sign-in 200
          check portal.example.com:9443 /portal/sign-in 200
          check ehr.example.com:8443 "/api/sync/quick-texts?since=0" 401

      # The deployment's site check (infra/deploy/check-sites.cs), as an administrator runs it after a deployment or an
      # upgrade, here against the stack: every name connects to this runner, the stack's certificate is the root, and,
      # since that certificate lasts a day, no number of days left is asked of it.
      - name: The deployment's site check passes
        run: >
          dotnet run ../deploy/check-sites.cs --
          --clinic https://ehr.example.com:8443 --remote https://ehr-remote.example.com:9443
          --portal https://portal.example.com:9443 --ca certs/rootCA.pem --connect 127.0.0.1 --days 0

      # The lab's door (step 12). The .env copied from .env.example has a lab key, so the on-prem app opens the door,
      # the migration job stores the key's hash, and the lab service runs. With the key, the on-prem site hands over
      # the orders waiting (none: an empty list); the cloud site has no door, key or not.
      - name: The lab's door
        run: |
          key=$(sed -n 's/^EHR_LAB_KEY=//p' .env)
          [ -n "$key" ]
          ask() {
            code=$(curl --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors \
              --cacert certs/example.com.pem --resolve "$1:127.0.0.1" --header "X-Lab-Key: $key" \
              --output /dev/null --write-out "%{http_code}" "https://$1/api/lab/orders")
            echo "https://$1/api/lab/orders with the lab's key: $code (expected $2)"
            [ "$code" = "$2" ]
          }
          ask ehr.example.com:8443 200
          ask ehr-remote.example.com:9443 401
          [ "$(docker compose ps --status running --services | grep -cx lab)" = 1 ]
          echo "The lab service is running"

      - name: Databases accept connections
        run: |
          docker compose exec -T -u postgres onprem-db pg_isready
          docker compose exec -T -u postgres cloud-db pg_isready

      # Every connection over the network to either database (the apps, the replica's and Barman's streams) is TLS;
      # the superuser's own shell over the local socket is the only one that isn't, and is left out.
      - name: Database connections use TLS
        run: |
          query="select count(*) filter (where not s.ssl) || ' plain, ' || count(*) filter (where s.ssl) || ' encrypted'
                 from pg_stat_ssl s join pg_stat_activity a using (pid) where a.client_addr is not null"
          for db in onprem-db cloud-db; do
            report=$(docker compose exec -T -u postgres "$db" psql -Atc "$query")
            echo "$db: $report"
            case "$report" in
              "0 plain, 0 encrypted") echo "Nothing is connected to $db"; exit 1 ;;
              "0 plain, "*) ;;
              *) exit 1 ;;
            esac
          done

      # The primary sees the cloud replica and Barman streaming through their replication slots.
      - name: Replication is streaming
        run: |
          query="select string_agg(s.slot_name || '=' || coalesce(r.state, 'not connected'), ' ' order by s.slot_name)
                 from pg_replication_slots s left join pg_stat_replication r on r.pid = s.active_pid"
          expected="barman=streaming cloud_replica=streaming"
          for _ in $(seq 30); do
            slots=$(docker compose exec -T -u postgres onprem-db psql -Atc "$query" || true)
            [ "$slots" = "$expected" ] && break
            sleep 2
          done
          echo "Slots: $slots"
          [ "$slots" = "$expected" ]
          [ "$(docker compose exec -T -u postgres cloud-db psql -Atc 'select pg_is_in_recovery()')" = t ]
          echo "cloud-db is a read-only standby"

      # The apps' roles end a transaction left idle for a minute (db/policies/00-roles.sql). Role settings are catalog
      # rows, so the replica has them too, for the cloud app's ehr_read.
      - name: The apps' roles have their idle limit on both databases
        run: |
          query="select string_agg(r.rolname || ' ' || array_to_string(s.setconfig, ','), '; ' order by r.rolname)
                 from pg_db_role_setting s join pg_roles r on r.oid = s.setrole where r.rolname in ('ehr_app', 'ehr_read')"
          expected="ehr_app idle_in_transaction_session_timeout=60s; ehr_read idle_in_transaction_session_timeout=60s"
          for db in onprem-db cloud-db; do
            for _ in $(seq 15); do
              settings=$(docker compose exec -T -u postgres "$db" psql -Atc "$query" || true)
              [ "$settings" = "$expected" ] && break
              sleep 2
            done
            echo "$db: $settings"
            [ "$settings" = "$expected" ]
          done

      # Barman's first base backup takes about a minute; `barman check` fails until it's done.
      - name: Backups are healthy
        run: |
          for _ in $(seq 36); do
            if report=$(docker compose exec -T -u postgres barman barman check onprem); then
              echo "$report"
              exit 0
            fi
            sleep 5
          done
          echo "$report"
          exit 1

      # A point-in-time restore from those backups, as restore-drill.cs says: a row written before a chosen time is in
      # the restored copy, one written after it isn't, and a few tables' counts and checksums are as they were then. It
      # restores inside the Barman volume, into restore-db, and cleans up after itself.
      - name: Restore drill
        run: dotnet run restore-drill.cs

      # Old backups are deleted with the WAL before them (infra/barman). The clinic's policy is the one in force: a
      # 6-day recovery window, with a base backup every 23 hours. Then Barman is restarted with compose.backup-drill.yaml (a base
      # backup at every pass of its loop, two kept), and the backup link's latency is lifted so a backup takes seconds,
      # not minutes: the stack's first backup goes, two remain, and no WAL file is older than where the older began.
      - name: Old backups are deleted
        run: |
          barman() { docker compose exec -T -u postgres barman barman "$@"; }
          barman show-server onprem | grep -E '^\s*retention_policy: RECOVERY WINDOW OF 6 DAYS$'
          first=$(barman list-backups --minimal onprem)
          echo "The stack's first backup: $first"
          [ "$(printf '%s\n' "$first" | grep -c .)" = 1 ]
          for stream in upstream downstream; do
            docker compose exec -T wan /toxiproxy-cli toxic remove --toxicName "latency_$stream" wan_backup
          done
          docker compose -f compose.yaml -f compose.backup-drill.yaml up --detach --no-deps barman
          for _ in $(seq 60); do
            barman -q cron || true
            backups=$(barman list-backups --minimal onprem || true)
            if ! printf '%s\n' "$backups" | grep -qx "$first" && [ "$(printf '%s\n' "$backups" | grep -c .)" = 2 ]; then
              break
            fi
            sleep 5
          done
          echo "Backups kept:" $backups
          if printf '%s\n' "$backups" | grep -qx "$first" || [ "$(printf '%s\n' "$backups" | grep -c .)" != 2 ]; then
            echo "The stack's first backup wasn't deleted, or more or fewer than two backups are kept"
            exit 1
          fi
          barman show-server onprem | grep -E '^\s*retention_policy: REDUNDANCY 2$'
          oldest=$(printf '%s\n' "$backups" | sort | head -n 1)
          begin=$(barman show-backup onprem "$oldest" | sed -n 's/^ *Begin WAL *: *//p')
          wals=$(docker compose exec -T -u postgres barman find /var/lib/barman/onprem/wals -type f -printf '%f\n' \
            | cut -c1-24 | grep -xE '[0-9A-F]{24}' | sort)
          lowest=$(printf '%s\n' "$wals" | head -n 1)
          echo "The older backup kept, $oldest, began at WAL $begin; the oldest WAL kept is $lowest"
          if [ -z "$begin" ] || [ -z "$lowest" ] || [[ "$lowest" < "$begin" ]]; then
            echo "WAL from before the oldest backup kept is still there"
            exit 1
          fi

      # An alert end to end, as a clinic would get it: the replica stops, and within minutes the administrators have an
      # email from Alertmanager in the mail catcher. Prometheus must first see the replica's slot active, and no such
      # email may be there before. ReplicaNotStreaming waits 2 minutes (infra/monitoring/alerts.yml); with a scrape and
      # Alertmanager's 30 seconds, the email is due about 3 minutes after the stop.
      - name: An alert is emailed when the replica stops
        run: |
          query() { curl --silent --show-error --fail --get --data-urlencode "query=$1" http://127.0.0.1:9090/api/v1/query; }
          emails() { curl --silent --show-error --fail --get --data-urlencode "query=subject:ReplicaNotStreaming" http://127.0.0.1:8025/api/v1/search; }
          for _ in $(seq 60); do
            active=$(query 'pg_replication_slots_slot_is_active{slot_name="cloud_replica"}' | jq -r '.data.result[0].value[1] // "none"')
            [ "$active" = 1 ] && break
            sleep 2
          done
          echo "The replica's slot, as Prometheus sees it: $active (1 is active)"
          [ "$active" = 1 ]
          [ "$(emails | jq '.messages_count')" = 0 ]
          docker compose stop cloud-db
          stopped=$(date +%s)
          until [ "$(emails | jq '.messages_count')" != 0 ]; do
            if [ "$(($(date +%s) - stopped))" -ge 300 ]; then
              echo "No email within 5 minutes of the replica stopping"
              exit 1
            fi
            sleep 5
          done
          echo "Emailed $(($(date +%s) - stopped)) s after the replica stopped:"
          emails | jq -r '.messages[0] | "\(.Subject) to \([.To[].Address] | join(", "))"'
          [ "$(emails | jq -r '[.messages[0].To[].Address] | join(",")')" = admins@example.com ]
          docker compose start cloud-db

      - name: Show containers and logs
        if: failure()
        run: |
          docker compose --profile monitoring ps --all
          docker compose --profile monitoring logs --no-color

      - name: Tear down
        if: always()
        run: docker compose --profile "*" down --volumes

  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The team's machines: Apple Silicon Macs and x64 Windows PCs. Running the desktop sync tests on both is
        # TC-UC8-06, NFR-10.
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/Ehr.Desktop/src-tauri
    env:
      # MSVC can't use paths over 260 characters, and OpenSSL's build nests deep under the runner's
      # long checkout folder, so build at the repository root instead of in src-tauri/target.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the Rust version and components pinned in rust-toolchain.toml.
      - name: Install Rust
        run: rustup toolchain install --no-self-update

      # The same folder as CARGO_TARGET_DIR, relative to the crate: rust-cache can't take an absolute path.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src/Ehr.Desktop/src-tauri -> ../../../target

      # The vendored OpenSSL build rejects Git's Perl, which can come first on PATH.
      - name: Use Strawberry Perl for OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = Get-Command perl -All | Where-Object Source -NotLike '*\Git\*' | Select-Object -First 1 -ExpandProperty Source
          if (-not $perl) { throw "No Perl other than Git's is on PATH." }
          Write-Output "Using $perl"
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build
        run: cargo build --locked

      # Every test, in a release build as clinicians run the app. That includes the encrypted store's tests
      # (TC-UC7-06, NFR-06), the offline chart timing (TC-UC7-05, NFR-02), which is skipped in debug builds, and the
      # other UC 7 and UC 8 test cases (TC-UC7-01 to 04, TC-UC8-01, 02, 04 and 06); --show-output prints its times.
      - name: Test
        run: cargo test --locked --release -- --show-output

      # The installers, unsigned (the expansion plan's step 20, docs/desktop-install.md): the .dmg on macOS, sealed ad
      # hoc, and the NSIS setup on Windows. Built on every run, so both platforms are known to bundle; nothing signs an
      # update here, and no key is ever given to CI. The CLI is cached with the toolchain after its first install.
      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version 2.12.0 --locked

      # A run started by hand may build them as another version, to test an update to it; the update's signature is
      # made on the owner's Mac (docs/desktop-install.md), never here.
      - name: Build the installer
        shell: bash
        env:
          DESKTOP_VERSION: ${{ inputs.desktop_version }}
        run: |
          if [ -n "$DESKTOP_VERSION" ]; then
            cargo tauri build --ci --config "{\"version\":\"$DESKTOP_VERSION\"}" -- --locked
          else
            cargo tauri build --ci -- --locked
          fi

      - name: Keep the installer
        if: github.event_name == 'workflow_dispatch' && inputs.upload_installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SwiftChart-${{ runner.os }}
          path: |
            ${{ github.workspace }}/target/release/bundle/dmg/*.dmg
            ${{ github.workspace }}/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 3

  dictation:
    name: Dictation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The command in README.md. The tests use a fake Hugging Face Hub, so they need no network.
      - name: Test setup_models.py
        run: uv run --no-project --python 3.12 --with pytest --with "huggingface_hub>=2.2,<3" python -m pytest src/Ehr.Dictation/tests

      # The sidecar decodes audio with ffmpeg, as its image does.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg

      # The packages exactly as each uv.lock pins them. Stand-ins replace MedASR and llama-server: no model is needed.
      - name: Test the dictation sidecar
        run: uv run --project src/Ehr.Dictation/sidecar --locked --python 3.12 pytest src/Ehr.Dictation/sidecar/tests

      - name: Test the dictation eval
        run: uv run --project eval --locked --python 3.12 pytest eval/tests

      # CI can't run the models, so it checks the committed results: they come from this commit's prompt, schema,
      # validation rules and test set, show no order or allergy change and no retracted value without a warning
      # (but those eval/known-limitations.toml accepts), and score no lower than the accepted baseline.
      - name: Check the committed eval results
        run: uv run --project eval --locked --python 3.12 python -m ehr_eval.gate

  # The dictation sidecar's image, on a runner of each server architecture, so nothing is emulated. Built to show it
  # builds and starts as it should; nothing is pushed.
  dictation-image:
    name: Dictation image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build --file src/Ehr.Dictation/sidecar/Dockerfile --tag ehr-dictation:ci src/Ehr.Dictation

      # Runs as its own non-root user, with ffmpeg and the note schema and prompt, and refuses to start without its keys.
      - name: Check the image
        run: |
          [ "$(docker run --rm --network none ehr-dictation:ci id -u)" = 10001 ]
          docker run --rm --network none ehr-dictation:ci ffmpeg -version | head -1
          docker run --rm --network none ehr-dictation:ci python -c "import ehr_dictation.api, ehr_dictation.prompt as p; p.load()"
          if docker run --rm --network none ehr-dictation:ci; then echo "It started without DICTATION_API_KEY"; exit 1; fi

  # AGENTS.md's render-time gate: the search and chart pages' server render time at 50,000 synthetic patients
  # (bench/Ehr.Bench). --assert fails the job when a kind of request's p99 excluding the commit is 20 ms or more. The full
  # time, the commit included, is only reported beside it in the run's summary: these runners' shared disks make commit
  # times unsteady, so its 20 ms target is checked on the clinic server.
  bench:
    name: Render-time benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # The table goes in the run's summary whether the gate passes or fails, and a run that printed no table says so;
      # either way the step ends with the benchmark's exit code.
      - name: Server render time at 50,000 patients
        run: |
          set -o pipefail
          status=0
          dotnet run --configuration Release --project bench/Ehr.Bench -- --assert | tee bench.txt || status=$?
          if grep -q '^Server render time' bench.txt; then
            { echo '```'; sed -n '/^Server render time/,$p' bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**The render-time benchmark failed (exit code $status) and printed no table.**" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  # Fails if any job it needs failed or was cancelled. A skipped job counts as passing, so a job
  # can later be limited to runs where its files changed.
  ci:
    # Branch protection requires a check by this name; renaming it means updating the ruleset.
    name: ci
    if: always()
    needs: [web, stack, desktop, dictation, dictation-image, bench]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac

  # Main only: the web image for both server architectures, tagged with the commit it came from.
  publish:
    name: Publish image
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # checkout
      packages: write # push the image to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile compiles on the runner's own architecture for each target, so no emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Ehr.Web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ehr-web:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=ehr-web
          cache-to: type=gha,mode=max,scope=ehr-web
