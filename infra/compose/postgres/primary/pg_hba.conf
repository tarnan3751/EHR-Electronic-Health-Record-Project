# On-prem primary. Superuser access is local-only: `docker compose exec -u postgres onprem-db psql`.
# TYPE  DATABASE     USER                         ADDRESS   METHOD
local   all          postgres                               peer

# The cloud replica and Barman arrive through the WAN proxy, which sits on this network.
hostssl replication  replicator,barman            samenet   scram-sha-256
hostssl postgres     barman                       samenet   scram-sha-256

# The on-prem app and migrations. These roles are created by db/policies.
hostssl ehr          ehr_owner,ehr_app,ehr_read   samenet   scram-sha-256
