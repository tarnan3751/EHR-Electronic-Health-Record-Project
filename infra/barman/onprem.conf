[onprem]
description = "On-prem primary, reached over the WAN link"
conninfo = host=wan port=5433 user=barman dbname=postgres sslmode=verify-full sslrootcert=/certs/rootCA.pem
streaming_conninfo = host=wan port=5433 user=barman sslmode=verify-full sslrootcert=/certs/rootCA.pem
backup_method = postgres
streaming_archiver = on
archiver = off
slot_name = barman
create_slot = manual
path_prefix = /usr/lib/postgresql/18/bin
# Keeps what restoring to any moment of the last 6 days needs: every backup that ended in them, the newest one that
# ended before them, and the WAL since that one began; `barman cron` deletes the rest. With a base backup every 23 hours
# (entrypoint.sh), nothing older than 7 days can be restored (infra/compose/README.md has the arithmetic).
retention_policy = RECOVERY WINDOW OF 6 DAYS
minimum_redundancy = 1
