[onprem]
description = "On-prem primary, reached over the WAN link"
conninfo = host=wan port=5433 user=barman dbname=postgres sslmode=verify-full sslrootcert=/certs/rootCA.pem
streaming_conninfo = host=wan port=5433 user=barman sslmode=verify-full sslrootcert=/certs/rootCA.pem
backup_method = postgres
streaming_archiver = on
archiver = off
slot_name = barman
create_slot = manual
path_prefix = /usr/lib/postgresql/18/bin
retention_policy = RECOVERY WINDOW OF 7 DAYS
minimum_redundancy = 1
