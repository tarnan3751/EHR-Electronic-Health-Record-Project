# BackupTooOld and BackupStateMissing held to their thresholds (alerts.yml), apart from alerts.test.yml since they take
# hours of evaluations: evaluated every 5 minutes, they run in seconds.
rule_files: [alerts.yml]
evaluation_interval: 5m

tests:
  # The last base backup began 1 s into the test's clock: at 25 hours, nothing; 15 minutes later, more than the rule's
  # 10 minutes past the 25 hours, an alert. No backup yet (0) is BackupsUnhealthy's, never this.
  - interval: 5m
    input_series:
      - series: 'barman_last_base_backup_start_timestamp_seconds{job="node", instance="node-exporter:9100"}'
        values: '0x400'
    alert_rule_test:
      - eval_time: 26h
        alertname: BackupTooOld
        exp_alerts: []
  - interval: 5m
    input_series:
      - series: 'barman_last_base_backup_start_timestamp_seconds{job="node", instance="node-exporter:9100"}'
        values: '1x400'
    alert_rule_test:
      - eval_time: 25h
        alertname: BackupTooOld
        exp_alerts: []
      - eval_time: 25h15m
        alertname: BackupTooOld
        exp_alerts:
          - exp_labels: {severity: warning, job: node, instance: "node-exporter:9100"}
            exp_annotations:
              summary: "No new base backup for over 25 hours"
              description: "The last base backup that succeeded began over 25 hours ago: see barman list-backups onprem and the backup host's log."

  # Barman's state never reported for an hour is an alert, not before; reported, never.
  - interval: 5m
    input_series:
      - series: 'up{job="node", instance="node-exporter:9100"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 55m
        alertname: BackupStateMissing
        exp_alerts: []
      - eval_time: 1h
        alertname: BackupStateMissing
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "Barman hasn't reported its backups' state for an hour"
              description: "No barman_check_ok from the node exporter: a first base backup still running or stuck, or Barman or the node exporter down. See the backup host's log and barman list-backups onprem."
  - interval: 5m
    input_series:
      - series: 'barman_check_ok{job="node", instance="node-exporter:9100"}'
        values: '1x20'
    alert_rule_test:
      - eval_time: 90m
        alertname: BackupStateMissing
        exp_alerts: []
