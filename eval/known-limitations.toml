# Retracted values, or drugs no gold value carries, that the dictation pipeline shows without a warning, which the
# owner has accepted as known limitations. The eval's gate (ehr_eval/gate.py) fails on any such value not listed here,
# and on any listed here that the results no longer show, so the list stays true. Changing it means scoring the stored
# answers again (ehr_eval/rescore.py), since the scoring hash covers it. Each entry: the recording (variant), the field,
# the value shown as the eval normalizes it (shown), why it gets through (reason), and when and by whom it was accepted.
#
# The clinician's review of each value against the transcript is the safety net for these (README.md, Dictation).

# The owner's caps on the Spanish acceptances below (his ruling of 2026-11-25, as step 15.1's cap on the trick
# sentences): the gate fails when more are found than the cap, counted as found, not as names, and when a cap isn't the
# number accepted by name beneath it, so it holds no slack.
most_mistranslations = 17
most_wrong_translations = 41

[[accepted]]
variant = "d22-cellulitis-ed--babble-5db"
# Step 14 (2026-11-22, decision D15): the same recording shows the same value, now in Subjective, which replaced History.
field = "subjective"
shown = "metoprolol"
reason = """At 5 dB of babble MedASR heard "on metoprolol I mean metformin" as "on metoprolol and metformin": no \
correction cue, no correction-like word between the two drug names, and no passage marked unclear beside them, so \
neither warning fires. Two drugs joined by "and" are an ordinary list."""
accepted = "2026-11-15"
by = "the owner"

