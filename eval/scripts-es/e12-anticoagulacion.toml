text = """
Control de anticoagulación. Mujer de [[76|setenta y seis]] años con fibrilación auricular. Toma warfarina [[5 mg|cinco
miligramos]] al día. Toma también metoprolol de [[100 mg|cien miligramos]], un cuarto de tableta en la mañana. Desde
hace [[2|dos]] semanas toma ibuprofeno para la artrosis. Refiere que ha tenido sangrado de encías al cepillarse. Niega
sangre en la orina o en las heces. Niega mareo, palpitaciones, dolor torácico y síncope. El INR de hoy es de
[[3,6|tres coma seis]]. Impresión: fibrilación auricular con INR por encima del rango. Plan: omitir la dosis de hoy.
Ibuprofeno: se suspende por el riesgo de sangrado. Metoprolol: continuar igual. Después, warfarina [[5 mg|cinco
miligramos]] al día excepto [[2,5 mg|dos coma cinco miligramos]] cada tercer día. Repetir INR en [[7|siete]] días, no,
espera, en [[5|cinco]] días. Valorar el cambio a apixabán en la próxima visita.
"""

