Hombre de [[22|veintidós]] años con dolor abdominal de [[3|tres]] días de evolución. Empezó como un dolor leve
alrededor del ombligo y ahora es un dolor intenso en la fosa ilíaca derecha. El dolor es de [[8|ocho]] sobre
[[10|diez]] y empeora al caminar y al toser. No tiene apetito desde ayer. Tiene náuseas. Niega vómito y niega diarrea.
Niega síntomas urinarios. No ha tenido fiebre en casa. Tomó ibuprofeno [[400 mg|cuatrocientos miligramos]] anoche sin
mejoría. No toma otros medicamentos. No fuma ni bebe alcohol. Sin antecedentes de cirugías abdominales. Trabaja en una
oficina y hace deporte los fines de semana. En la exploración, temperatura [[37,9|treinta y siete coma nueve]] grados,
tensión arterial [[118/72|ciento dieciocho sobre setenta y dos]], FC [[102|ciento dos]], dolor a la palpación en la
fosa ilíaca derecha con signo de rebote positivo. Abdomen blando, sin masas. Signo de Rovsing positivo. Ruidos
intestinales disminuidos. Sin dolor a la percusión lumbar en ambos lados. Impresión: probable apendicitis aguda.
Descartar litiasis renal derecha. Plan: ondansetrón [[4 mg|cuatro miligramos]] sublingual ahora. Ketorolaco
[[30 mg|treinta miligramos]] intravenoso cada [[8|ocho]] horas si hay dolor. Pido un ultrasonido abdominal urgente y
una biometría hemática. Valoración por cirugía hoy. Nada por boca. Solución salina [[500 ml|quinientos mililitros]]
intravenosa en [[2|dos]] horas. Informo al paciente del diagnóstico probable. Reevaluar en [[4|cuatro]] horas.
"""

