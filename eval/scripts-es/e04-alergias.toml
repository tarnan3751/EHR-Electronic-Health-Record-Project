text = """
Consulta por erupción cutánea. Mujer de [[33|treinta y tres]] años que empezó con ronchas en los brazos hace [[2|dos]]
días, después de tomar amoxicilina. No tiene dificultad para respirar ni hinchazón de labios. Es alérgica a la sulfa
desde la infancia. Tolera el ibuprofeno sin problema. En la exploración, habones en ambos brazos, sin afectación de
mucosas. Impresión: urticaria probablemente por amoxicilina. Plan: suspender amoxicilina. Agrega la amoxicilina a sus
alergias. Quita el ibuprofeno de su lista de alergias. Cetirizina [[10 mg|diez miligramos]] al día durante
[[5|cinco]] días.
"""

