text = """
Revisión de insuficiencia cardiaca. Hombre de [[72|setenta y dos]] años con insuficiencia cardiaca con fracción de
eyección reducida. Antecedente de infarto en [[2018|dos mil dieciocho]]. Su padre tuvo un infarto a los
[[55|cincuenta y cinco]] años. Refiere disnea al subir un piso de escaleras y edema en los tobillos por las tardes.
Duerme con [[2|dos]] almohadas. Niega dolor torácico. Ha estado tomando ibuprofeno para el dolor de espalda. Medicación
actual: furosemida [[40 mg|cuarenta miligramos]] al día, bisoprolol [[5 mg|cinco miligramos]] al día y enalapril
[[10 mg|diez miligramos]] dos veces al día. En la exploración, TA [[108/64|ciento ocho sobre sesenta y cuatro]], FC
[[62|sesenta y dos]], peso [[84 kg|ochenta y cuatro kilos]], [[2 kg|dos kilos]] más que en la última visita.
Crepitantes en ambas bases y edema con fóvea hasta media pierna. El último ecocardiograma muestra una FEVI de
[[35 %|treinta y cinco por ciento]]. Impresión: insuficiencia cardiaca descompensada, probablemente por el
ibuprofeno. Plan: suspender ibuprofeno. Aumentar furosemida a [[80 mg|ochenta miligramos]] al día durante [[3|tres]]
días y luego volver a [[40 mg|cuarenta miligramos]]. Disminuir bisoprolol a [[2,5 mg|dos coma cinco miligramos]] al
día. Continuar enalapril [[10 mg|diez miligramos]] dos veces al día. Pido un ecocardiograma de control. Restricción de
sal y control de peso diario. Revisión en una semana.
"""

