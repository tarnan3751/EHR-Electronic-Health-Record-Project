Mujer de [[51|cincuenta y un]] años con hipotiroidismo. Antecedente de tiroidectomía total en [[2019|dos mil
diecinueve]] por bocio. Toma levotiroxina [[50 microgramos|cincuenta microgramos]] al día en ayunas. Refiere
cansancio y aumento de peso. Niega palpitaciones. Analítica del [[3 de marzo de 2026|tres de marzo de dos mil
veintiséis]]: TSH [[6,2|seis coma dos]]. Peso [[71 kg|setenta y un kilos]]. Impresión: hipotiroidismo con dosis
insuficiente de levotiroxina. Plan: aumentar levotiroxina a [[75 microgramos|setenta y cinco microgramos]] al día en
ayunas. Repetir TSH en [[6|seis]] semanas.
"""

