Añadido a la nota de hoy, por la función renal. Recibe heparina [[5.000 unidades|cinco mil unidades]] subcutáneas cada
[[12|doce]] horas desde la cirugía de cadera. La analítica de esta mañana muestra un filtrado glomerular de
[[28|veintiocho]] y una creatinina de [[2,1|dos coma uno]]. Plan: suspender metformina. Iniciar linagliptina [[5
