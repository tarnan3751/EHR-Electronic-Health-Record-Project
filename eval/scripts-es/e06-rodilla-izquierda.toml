text = """
Varón de [[67|sesenta y siete]] años con artrosis de ambas rodillas. Refiere dolor en la rodilla izquierda desde hace
un mes, peor al subir escaleras en el gym. El dolor es de [[6|seis]] sobre [[10|diez]] y le despierta por la noche
[[2|dos]] veces por semana. Tiene rigidez por la mañana de unos [[15|quince]] minutos. No ha notado bloqueos ni fallos
de la rodilla. Ha probado una rodillera sin mucha mejoría. La rodilla derecha está bien. Niega traumatismo. Niega
fiebre. Toma paracetamol [[1 g|un gramo]] cada [[8|ocho]] horas. No toma otros medicamentos. Trabaja de pie como
camarero [[8|ocho]] horas al día. En la exploración, peso [[94 kg|noventa y cuatro kilos]], rodilla izquierda con
derrame leve y crepitación, rodilla derecha sin derrame. Flexión de la rodilla izquierda hasta [[110|ciento diez]]
grados, sin calor ni enrojecimiento. Sin dolor en la cadera izquierda. Marcha sin cojera. Impresión: artrosis de
rodilla izquierda con brote inflamatorio. Plan: añadir ibuprofeno [[400 mg|cuatrocientos miligramos]] cada [[8|ocho]]
horas con comida durante [[5|cinco]] días. Continuar paracetamol. Hielo local [[20|veinte]] minutos [[3|tres]] veces
al día. Derivar a fisioterapia. Agendar resonancia de la rodilla izquierda. Ejercicios para fortalecer el cuádriceps
en casa todos los días. Bajar de peso con dieta y caminar en llano. Control en [[6|seis]] semanas. Si aparece fiebre o
la rodilla se pone roja y caliente, que vuelva antes.
"""

