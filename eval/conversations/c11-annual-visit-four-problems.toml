[gold.plan]
value = "Swapping the biscuits for fruit or a handful of nuts would be a good start. For your blood pressure, increase the lisinopril to 20 mg once a day, and keep up the readings at home. Continue the metformin and the atorvastatin as before. You'll need to fast from midnight, though, so book an early slot. I'll show you 3 exercises to do twice a day. You can use ibuprofen gel on it at bedtime and keep taking the paracetamol when you need it. Please don't take ibuprofen tablets, because they can push your blood pressure up and they're hard on the kidneys. If it's no better in 6 weeks, we can arrange an ultrasound. I want you to see our counselor here, and the front desk can book that for you on your way out. Try to get back to your walking group this week, even if you don't feel like it. Book in with the optician for your diabetes eye check, too. Come back in 4 weeks, and we'll go through your blood pressure, your results and how your mood is. The nurse can give you the flu jab on your way out."
