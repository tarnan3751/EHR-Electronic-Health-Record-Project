dates = ["2026-09-03", "2026-09-07", "2026-09-04"]
drugs = ["furosemide", "bisoprolol", "sacubitril", "valsartan", "spironolactone", "empagliflozin", "tiotropium", "albuterol", "prednisone", "ibuprofen", "acetaminophen", "doxycycline"]
forbidden = ["I'll add doxycycline to the allergy list", "you'll have a new one at your usual pharmacy by tomorrow"]
