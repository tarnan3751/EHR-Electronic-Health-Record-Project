# The review's wrong translations (the expansion plan's step 17, the review of 2026-11-24, attack5.py), as a gated set:
# English that changes what the Spanish says, each written from words outside the checks' lists, and English that says
# what it says. Each pair is checked as the review's harness checked it, with no model: the Spanish, said after a
# sentence of filler (context) so it is one passage of a longer transcript, cited whole as one statement's source, and
# the English as that statement, in Plan, through the sidecar's Spanish checks (translation.check(); ehr_eval/
# wrong_translations.py). A wrong pair passes when its field is offered with no reason and no warning; a faithful pair
# is refused when its field is discarded.
#
# The eval's gate (gate.py) fails on every wrong pair marked as reversing the meaning that passes without a warning,
# unless the owner has accepted it by its id in eval/known-limitations.toml ([[accepted_wrong_translation]]), and on
# each accepted one that no longer passes; it reports the rest: wrong pairs passing, faithful pairs refused. It also
# fails when this file isn't the one it was written for (gate.py's WRONG_TRANSLATIONS_SHA256): a change here is a change
# to the gate, recorded there with it.
#
# reverses: read whole, the English says the opposite of the Spanish, or says of the patient what the Spanish says of
# someone else, or says as certain what the Spanish doubts, or moves a negation from one finding to another; the
# developer's reading, for the owner to check, and when in doubt a pair is marked as reversing. The file holds 70 wrong
# pairs; the review counted 69, leaving out w23 ("Su hermano, también diabético"), the appositive the checks' header
# already names as a limit: marked reversing in doubt ("también" says the patient is diabetic too, and the English
# drops the brother's).

