text = """
Visita a domicilio por una caída. Mujer de [[81|ochenta y un]] años que vive sola. Se cayó en el baño la noche del
[[20 de noviembre|veinte de noviembre]] al levantarse a orinar. Refiere que se mareó al ponerse de pie. No perdió el
conocimiento y no se golpeó la cabeza. Desde entonces tiene dolor moderado en la muñeca izquierda. Es la segunda caída
este año. Toma zolpidem [[10 mg|diez miligramos]] y doxazosina [[4 mg|cuatro miligramos]] por la noche, y enalapril
[[20 mg|veinte miligramos]] por la mañana. Su hija dice que últimamente está más olvidadiza. En la exploración, tensión
arterial sentada [[136/78|ciento treinta y seis sobre setenta y ocho]] y de pie [[108/62|ciento ocho sobre sesenta y
dos]], FC [[72|setenta y dos]]. Hematoma en el antebrazo izquierdo. Muñeca izquierda con dolor a la palpación, sin
deformidad y con movilidad completa. Camina con pasos cortos y se apoya en los muebles. Impresión: caída por probable
hipotensión ortostática, favorecida por la medicación. Contusión de muñeca izquierda, a descartar fractura. Posible
deterioro cognitivo leve. Plan: bajar el zolpidem a [[5 mg|cinco miligramos]] por la noche durante [[2|dos]] semanas y
luego retirarlo. Retirar la doxazosina. Continuar enalapril [[20 mg|veinte miligramos]] por la mañana. Pido una
radiografía de la muñeca izquierda. Luz de noche en el pasillo y barra de apoyo en el baño. Hacer un test cognitivo en
la próxima visita. Nueva visita en [[10|diez]] días.
"""

