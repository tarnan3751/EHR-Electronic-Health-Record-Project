text = """
Hombre de [[38|treinta y ocho]] años, cocinero, que se cortó la palma de la mano derecha con un cuchillo hace
[[2|dos]] horas. Es diestro. Última vacuna del tétanos en [[2014|dos mil catorce]]. Sin alergias conocidas. Herida
limpia de [[3 cm|tres centímetros]] en la palma derecha, sin cuerpos extraños. Mueve bien todos los dedos y la
sensibilidad es normal. Impresión: herida incisa de la palma derecha sin lesión tendinosa. Plan: se lava con suero y
se anestesia con lidocaína al [[1 %|uno por ciento]]. Se cierra con [[4|cuatro]] puntos. Refuerzo de la antitetánica
hoy. Mantener la herida seca [[48|cuarenta y ocho]] horas. No hacen falta antibióticos. Retirar los puntos en
[[10|diez]] días.
"""

