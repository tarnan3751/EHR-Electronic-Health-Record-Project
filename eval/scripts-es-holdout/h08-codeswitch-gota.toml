text = """
Hombre de [[58|cincuenta y ocho]] años que viene por dolor en el dedo gordo del pie derecho desde hace [[2|dos]] días.
Dice que el dolor es intenso, de [[9|nueve]] sobre [[10|diez]], y que no aguanta ni el roce de la sábana. El weekend
comió mariscos y tomó cerveza. Niega fiebre y niega golpes en el pie. Es el primer episodio. Antecedente de cálculos
renales en [[2021|dos mil veintiuno]]. Su padre tenía gota. Para la presión toma hidroclorotiazida [[25
mg|veinticinco miligramos]] en la mañana. En la exploración, temperatura [[36,9|treinta y seis coma nueve]] grados,
presión arterial [[138/84|ciento treinta y ocho sobre ochenta y cuatro]]. Primer dedo del pie derecho rojo, caliente
e hinchado, muy doloroso al tacto. Pie izquierdo normal. El ácido úrico del lab de hoy es de [[8,7 mg/dl|ocho coma
siete miligramos por decilitro]]. Impresión: probable flare de gota en el pie derecho. Artritis séptica poco probable.
La hidroclorotiazida puede estar subiendo el ácido úrico. Plan: colchicina [[1 mg|un miligramo]] ahora y [[0,5
mg|cero coma cinco miligramos]] dentro de una hora. Retirar la hidroclorotiazida y empezar amlodipino [[5 mg|cinco
miligramos]] al día. No empezar alopurinol por ahora. Hielo local y reposo del pie. Evitar el alcohol y los mariscos.
Follow-up en [[2|dos]] semanas.
"""

