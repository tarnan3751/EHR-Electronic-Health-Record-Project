text = """
Control prenatal. Mujer de [[31|treinta y un]] años, segundo embarazo, de [[28|veintiocho]] semanas. Fecha probable de
parto: [[16 de febrero de 2027|dieciséis de febrero de dos mil veintisiete]]. Antecedente de diabetes gestacional en
el primer embarazo, que terminó en cesárea en [[2023|dos mil veintitrés]]. Su madre tuvo preeclampsia. Refiere que el
bebé se mueve bien. Niega sangrado, niega pérdida de líquido y niega contracciones. Tiene cansancio y calambres en las
piernas por las noches. No tiene dolor de cabeza ni alteraciones visuales. Toma ácido fólico [[400
microgramos|cuatrocientos microgramos]] al día. No fuma. En la exploración, presión arterial [[112/70|ciento doce
sobre setenta]], peso [[72,5 kg|setenta y dos coma cinco kilos]], [[1,5 kg|un kilo y medio]] más que hace
[[4|cuatro]] semanas. Altura uterina de [[28 cm|veintiocho centímetros]]. Frecuencia cardiaca fetal de [[146|ciento
cuarenta y seis]] latidos por minuto. Sin edema en las piernas. Analítica del [[17 de noviembre de 2026|diecisiete de
noviembre de dos mil veintiséis]]: hemoglobina [[10,4 g/dl|diez coma cuatro gramos por decilitro]], ferritina
[[9|nueve]], glucosa a la hora de [[128 mg/dl|ciento veintiocho miligramos por decilitro]]. Impresión: embarazo de
[[28|veintiocho]] semanas de curso normal. Anemia leve, probablemente por falta de hierro. Cribado de diabetes
gestacional negativo. Plan: iniciar sulfato ferroso [[325 mg|trescientos veinticinco miligramos]] al día con zumo de
naranja. Continuar ácido fólico. Vacuna de la tosferina hoy. Pido un hemograma de control para dentro de un mes. Se le
explican los signos de alarma. Próximo control en [[2|dos]] semanas.
"""

