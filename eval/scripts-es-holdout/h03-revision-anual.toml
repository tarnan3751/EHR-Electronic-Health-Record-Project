Mujer de [[52|cincuenta y dos]] años que viene a su revisión anual. Antecedentes familiares de cáncer de colon en su
padre a los [[60|sesenta]] años. Su hermana tiene diabetes tipo [[2|dos]]. Refiere que la semana pasada tuvo urticaria
