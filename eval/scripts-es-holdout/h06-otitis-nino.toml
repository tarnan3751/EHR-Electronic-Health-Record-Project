text = """
Niño de [[3|tres]] años que acude a urgencias por dolor en el oído derecho desde hace [[2|dos]] días. La madre refiere
fiebre de hasta [[39,2|treinta y nueve coma dos]] grados desde anoche. Está irritable y come menos, pero toma bien los
líquidos. No ha vomitado y no le supura el oído. Lleva una semana con mocos. Es alérgico a la penicilina: a los
[[2|dos]] años le salió un sarpullido por todo el cuerpo. Añade la penicilina a su lista de alergias. Vacunas al día.
En la exploración, peso [[15 kg|quince kilos]], temperatura [[38,6|treinta y ocho coma seis]] grados. Tímpano derecho
abombado y enrojecido. Tímpano izquierdo normal. Faringe sin exudado. Auscultación pulmonar normal. Impresión: otitis
media aguda derecha. Plan: azitromicina [[150 mg|ciento cincuenta miligramos]] una vez al día durante [[5|cinco]]
días, digo, durante [[3|tres]] días. Ibuprofeno en suspensión, [[7,5 ml|siete coma cinco mililitros]] cada [[8|ocho]]
horas si hay fiebre o dolor. Se explica a la madre que vuelva si sigue con fiebre a las [[48|cuarenta y ocho]] horas o
si aparece hinchazón detrás de la oreja.
"""

