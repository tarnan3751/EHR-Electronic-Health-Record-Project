text = """
Consulta por dolor lumbar. Hombre de [[46|cuarenta y seis]] años que trabaja en un almacén y carga cajas pesadas todos
los días. No fuma y no toma medicación de forma habitual. Refiere dolor lumbar desde hace [[10|diez]] días, que empezó
al levantar una caja del suelo. El dolor baja por la parte de atrás de la pierna derecha hasta la rodilla, sin llegar
al pie. Lo describe como intenso por las mañanas y moderado por las tardes. Empeora al estar sentado mucho tiempo y al
toser, y mejora al caminar. Niega pérdida de fuerza en las piernas, niega problemas para orinar y niega fiebre.
Tampoco ha notado hormigueo en los pies. Antecedente de un episodio parecido hace [[3|tres]] años, que mejoró con
reposo relativo en unas semanas. Ha tomado paracetamol [[1 g|un gramo]] cada [[8|ocho]] horas, con poca mejoría.
Duerme mal por el dolor y ha faltado al trabajo [[2|dos]] días esta semana. Le preocupa no poder volver pronto al
trabajo. En la exploración, TA [[128/82|ciento veintiocho sobre ochenta y dos]], FC [[76|setenta y seis]], temperatura
[[36,6|treinta y seis coma seis]] grados. Camina sin cojera. Contractura de la musculatura lumbar derecha, con dolor a
la palpación. Lasègue positivo en la pierna derecha a los [[40|cuarenta]] grados. Fuerza y sensibilidad conservadas en
ambas piernas. Reflejos simétricos. Abdomen blando, sin masas palpables. Impresión: lumbociática derecha aguda,
probablemente por una hernia discal. No hay signos de alarma. Plan: suspender el paracetamol. Iniciar ibuprofeno [[600
mg|seiscientos miligramos]] cada [[8|ocho]] horas con comida durante [[7|siete]] días. Calor local por las noches.
Evitar cargar peso durante [[2|dos]] semanas. Caminar a diario según tolerancia. Derivar a fisioterapia. Se le dan
recomendaciones de higiene postural. Se explica al paciente que acuda a urgencias si nota pérdida de fuerza o
problemas para orinar. Control en [[3|tres]] semanas, antes si empeora.
"""

