# The trick sentences (the expansion plan's step 15.1): the third review's 341 sentences that try to make the closed
# sentence propose what it mustn't (validation.py, "plain"), with the controls it wrote that must be proposed, and a
# family added in step 15.1, a line break or a new paragraph after an instruction. Each is a whole transcript. The
# eval's gate weighs every one again with this commit's checks, no model needed (ehr_eval/tricks.py; gate.py), and
# fails when a sentence marked as reversing the meaning is proposed, or when the wrong proposals, a proposal for any
# sentence expected held back, number more than most_wrong. eval/tests/test_tricks.py has a case for each sentence.
#
# Each group: its family (the review's letter); what is expected (expect): proposed, or held_back; for those held back,
# whether a proposal would reverse the meaning (reverses): read whole, the sentence says not to do it, takes it back,
# corrects it to something else, says it isn't needed or was done already, puts it in doubt or on hold, has someone
# decide against it or decline it, or lists it among what not to do; and, for a wrong proposal the owner tolerates,
# its kind (tolerated), whose reason is under [tolerated]. Not reversing: a vague or non-item, a quantity, a join, a
# report, someone else, a condition, a time for later, the past, or the design ("call in" needs its pharmacy). When in
# doubt, a sentence is marked as reversing.
#
# most_wrong is the number of sentences in the tolerated groups, which a test keeps equal: when one is fixed, it moves
# to the group of its family and most_wrong comes down. The owner's rule (2026-11-24): no wrong proposal that reverses
# the meaning, and no more wrong proposals than step 15.1 left.

most_wrong = 7

[tolerated]
lead_in_filler = "A lead-in said with filler words: still the clinician's own instruction, said plainly; nothing takes it back."
everyday_item = "An everyday word the reference data names (water is an RxNorm ingredient): said as an instruction, it opens an empty form the clinician dismisses."
dose_corrected_without_a_cue = "A dose corrected without a cue: the item is right, and a proposal carries no dose, which the clinician picks on the empty form."
medication_joined_to_a_test = "A medication joined to a test: both are orderables, a proposal opens one order, and the clinician orders the rest from the chart."
request_reported_before = "A request reported two sentences before: whose idea it was doesn't reverse it; the clinician still says plainly to order it."

