# The trick sentences (the expansion plan's step 15.1): the third review's 341 sentences that try to make the closed
# sentence propose what it mustn't (validation.py, "plain"), with the controls it wrote that must be proposed; a family
# added in step 15.1, a line break or a new paragraph after an instruction; and the 183 sentences and 54 plain controls
# step 15.1's own review wrote ("review" families). Each is a whole transcript. The eval's gate weighs every one again
# with this commit's checks, no model needed (ehr_eval/tricks.py; gate.py), and fails when a sentence expected held back
# is proposed and the owner hasn't accepted it by name ([accepted], below), when one accepted by name is no longer
# proposed, when most_wrong isn't the number accepted, when the wrong proposals, a proposal for any sentence expected
# held back, number more than most_wrong, or when a control is not proposed at every instruction it lists. It also fails
# when this file isn't the one it was written for (gate.py's TRICK_SENTENCES_SHA256): a change here is a change to the
# gate, recorded there with it. eval/tests/test_tricks.py has a case for each sentence that reverses the meaning and is
# held back, and each control. The review's sentences the rules still propose are in groups marked still_proposed; they
# and the tolerated sentences are exactly those accepted by name, which the gate and a test keep so: when the rules hold
# one back, it moves to its family's group and leaves [accepted], and most_wrong comes down with it.
#
# Each group: its family (the review's letter); what is expected (expect): proposed, held_back, or cost (a plain
# instruction the strict rule holds back: what it costs, reported, and no wrong proposal if proposed); for those held
# back, whether a proposal would reverse the meaning (reverses): read whole, the sentence says not to do it, takes it
# back, corrects it to something else, says it isn't needed or was done already, puts it in doubt or on hold, has
# someone decide against it or decline it, or lists it among what not to do; and, for a wrong proposal the owner
# tolerates, its kind (tolerated), whose reason is under [tolerated]. Not reversing: a vague or non-item, a quantity, a
# join, a report, someone else, a condition, a time for later, the past, or the design ("call in" needs its pharmacy).
# When in doubt, a sentence is marked as reversing.
#
# most_wrong is the number of sentences accepted by name, which the gate keeps equal; each gives one proposal, and the
# gate counts proposals, so one that starts giving two takes the count over it. The owner's rule was first
# (2026-11-24, morning) no wrong proposal that reverses the meaning; no rule reached it, and the same day he put a cap
# at what step 15.1 left in its place, accepting each sentence still proposed by name (below).
#
# [accepted]: the wrong proposals the owner accepts by name, as a known limit: each sentence exactly as its group has
# it, accepted on the date, by the person and for the reason given there, which hold for each. He gave them in writing
# on 2026-11-24 (his withdrawal of step 15.2, docs/expansion/PLAN.md's decision log), and a developer agent wrote them
# here on his instruction: the one time an agent writes an owner's acceptance. Only the owner adds one.

most_wrong = 96

[tolerated]
lead_in_filler = "A lead-in said with filler words: still the clinician's own instruction, said plainly; nothing takes it back."
everyday_item = "An everyday word the reference data names (water is an RxNorm ingredient): said as an instruction, it opens an empty form the clinician dismisses."
dose_corrected_without_a_cue = "A dose corrected without a cue: the item is right, and a proposal carries no dose, which the clinician picks on the empty form."
medication_joined_to_a_test = "A medication joined to a test: both are orderables, a proposal opens one order, and the clinician orders the rest from the chart."
request_reported_before = "A request reported two sentences before: whose idea it was doesn't reverse it; the clinician still says plainly to order it."

[accepted]
by = "Tahseen Arnan, the owner"
on = 2026-11-24
reason = """A known limit. In his words: "The trick sentences still proposed (the review's 89, and the rest of the \
96 wrong proposals) are accepted by name in my name, as a known limit" and "proposals stay, with a cap in place of \
zero on the trick sentences, because no rule reached zero and the feature is wanted for the demo."
"""
