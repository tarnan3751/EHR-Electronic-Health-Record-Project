# The clinical gold for proposals (the expansion plan's step 15): every order, or allergy to add, the test set's
# scripts dictate that a clinician would expect the dictation to propose, as the scripts' [[proposals]] said before the
# closed sentence (fe3c3b8). Each script's own [[proposals]] is the rule-following gold, what the checks' rules allow
# (validation.py's closed sentence), and every one of them is here too; the rest here are held back by those rules,
# each a [[not_proposed]] of its script with the rule. The eval scores the dictation against both, as the fields have
# two golds (README.md, Two gold sets): metrics.proposals against the rule-following gold, metrics.proposals_clinical
# against this one. It is part of the gold hash. Each entry: the kind (order, or allergy_addition), the words (one of
# the script's forbidden passages) and the item they name, "" when they name it only by referring back.

